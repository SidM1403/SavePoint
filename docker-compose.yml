services:
  postgres:
    image: postgres:15
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      POSTGRES_DB: questlog
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
